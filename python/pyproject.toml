[project]
name = "agentic-ai-kurs"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[anthropic]==2.57.0",
    # Pinned explicitly: anthropic 2.x broke pydantic-ai 2.57.0, and the extra has no upper bound
    "anthropic==1.17.0",
]

[tool.uv]
package = false
# Relative cooldowns require uv 0.9.17 or newer
required-version = ">=0.9.17"
# Cooldown: only install versions that are at least 7 days old (including transitive ones)
exclude-newer = "7 days"
